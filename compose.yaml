services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buglife
    ports:
      - '5432:5432'
    volumes:
      - buglife_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d buglife']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  buglife_postgres:
