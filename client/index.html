<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101114" />
    <meta
      name="description"
      content="BugLife — a collaborative bug tracker for student developer teams. Because Every Project Has Bugs."
    />
    <title>BugLife — Because Every Project Has Bugs.</title>
    <script>
      try {
        document.documentElement.classList.toggle(
          'dark',
          localStorage.getItem('buglife-theme') !== 'light',
        );
      } catch {
        /* Dark is the default. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
